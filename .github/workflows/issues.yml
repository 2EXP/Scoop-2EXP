name: Issues

on:
  issues:
    types: [opened]

# The handler comments, labels and closes issues, commits hash fixes and can open a PR for them.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  issue-handler:
    name: Issue Handler
    runs-on: windows-latest
    if: "${{ !contains(github.event.issue.title, '[Bug]') && !contains(github.event.issue.title, '[Request]') && contains(github.event.issue.title, '.') && contains(github.event.issue.title, ': ') }}"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Issue Handler
        uses: ScoopInstaller/GitHubActions@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
